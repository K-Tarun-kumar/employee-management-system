<h2>Employee List</h2>

<table border="1">
    <tbody>
  <tr>
    <th>Name</th>
    <th>Email</th>
    <th>Salary</th>
    <th>Department</th>
    <th>Actions</th>
  </tr>

  <tr *ngFor="let emp of employees">
    <td>{{emp.name}}</td>
    <td>{{emp.email}}</td>
    <td>{{emp.salary}}</td>
    <td>{{emp.department}}</td>
    <td>
      <button (click)="deleteEmployee(emp.id)">Delete</button>
    </td>
    </tr>
    
  </tbody>
</table>
